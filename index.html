<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef1f5; --card:#fff; --ink:#1b2330; --sub:#6b7686; --line:#e2e7ee;
  --accent:#165DFF; --accent2:#0b3fa8;
}
body{background:var(--bg);color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:20px 18px 60px}
header{background:linear-gradient(135deg,#0b2545,#165DFF);color:#fff;border-radius:16px;
  padding:26px 28px;margin-bottom:18px;box-shadow:0 8px 26px rgba(11,37,69,.18)}
header h1{font-size:25px;letter-spacing:.5px}
header .sub{opacity:.86;margin-top:6px;font-size:13.5px}
header .meta{margin-top:12px;font-size:12px;opacity:.7}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
nav button{border:1px solid var(--line);background:#fff;color:var(--sub);
  padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13.5px;
  font-family:inherit;transition:.16s;white-space:nowrap}
nav button:hover{border-color:#b9c6dc;color:var(--ink)}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 4px 12px rgba(22,93,255,.28)}
.card{background:var(--card);border-radius:14px;padding:20px 22px;margin-bottom:16px;
  box-shadow:0 2px 10px rgba(20,40,80,.06)}
.card h2{font-size:17px;margin-bottom:4px}
.card h2 .tag{font-size:11.5px;font-weight:400;color:var(--sub);
  background:#f1f4f9;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:2px}
.card .desc{color:var(--sub);font-size:12.5px;margin-bottom:14px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.ctrl input[type=search],.ctrl select{font-family:inherit;font-size:13px;padding:7px 11px;
  border:1px solid var(--line);border-radius:9px;background:#fbfcfe;color:var(--ink);outline:none}
.ctrl input[type=search]{width:220px}
.ctrl input[type=search]:focus,.ctrl select:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(22,93,255,.12)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
  border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;
  color:var(--sub);user-select:none;transition:.14s}
.chip i{width:9px;height:9px;border-radius:50%;display:block}
.chip.on{background:#eef4ff;border-color:var(--accent);color:var(--ink);font-weight:600}
.lbl{font-size:12.5px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:600;font-size:12.5px;background:#f7f9fc;
  position:sticky;top:0;cursor:pointer;white-space:nowrap}
th:hover{color:var(--accent)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:#f7faff}
.scroll{max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.src{font-size:11.5px;color:#8b96a5;margin-top:12px;line-height:1.9}
.src b{color:var(--sub);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  vertical-align:middle}
.seg button{border:0;background:#fff;color:var(--sub);padding:6px 13px;font-size:12.5px;
  cursor:pointer;font-family:inherit;transition:.14s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent);color:#fff}
.axwrap{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap}
.axnum{width:84px;font-family:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);
  border-radius:8px;background:#fbfcfe;color:var(--ink);outline:none}
.axnum:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,93,255,.12)}
.axreset{border:1px solid var(--line);background:#fff;color:var(--sub);padding:5px 11px;
  border-radius:8px;font-size:12.5px;font-family:inherit;cursor:pointer;transition:.14s}
.axreset:hover{color:var(--ink);border-color:#b9c6dc}
.pnote{background:#f7f9fc;border-left:3px solid var(--accent);padding:9px 14px;
  border-radius:0 8px 8px 0;font-size:12.5px;color:#42506a;margin:0 0 12px;line-height:1.65}
.pnote b{color:#1F3864}
.trap{background:#fff8f0;border-left:3px solid #E8A33D;padding:8px 13px;border-radius:0 8px 8px 0;
  font-size:12px;color:#8a5a10;margin:8px 0 0}
.srclist a{color:var(--accent);text-decoration:none;font-size:12.8px;line-height:1.85;
  word-break:break-all;display:block;padding:2px 0}
.srclist a:hover{text-decoration:underline;color:var(--accent2)}
.srcgrp{margin-bottom:16px}
.srcgrp h3{font-size:13.5px;color:#1F3864;margin:0 0 6px;padding-bottom:5px;
  border-bottom:1px solid var(--line)}
.formula{background:#0b2545;color:#fff;padding:13px 18px;border-radius:10px;font-size:14px;
  text-align:center;letter-spacing:.4px;margin:0 0 12px;font-weight:600}
.tip{position:fixed;pointer-events:none;background:rgba(20,28,42,.95);color:#fff;
  padding:8px 11px;border-radius:8px;font-size:12.5px;line-height:1.6;z-index:99;
  opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.24)}
.tip.on{opacity:1}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;
  margin-bottom:16px}
.kpi div{background:#f7f9fc;border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.kpi .v{font-size:20px;font-weight:700;color:var(--accent2);letter-spacing:-.4px}
.kpi .k{font-size:12px;color:var(--sub);margin-top:2px}
svg{display:block;width:100%;height:auto;overflow:visible}
.axis{font-size:11px;fill:#8b96a5}
.grid{stroke:#e9edf3;stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12.5px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.legend span.off{opacity:.32}
.legend i{width:14px;height:3px;border-radius:2px;display:block}
.legend i.sq{width:10px;height:10px;border-radius:50%}

const tip = document.getElementById('tip');
function showTip(e, html){ tip.innerHTML = html; tip.classList.add('on'); moveTip(e); }
function moveTip(e){
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip(){ tip.classList.remove('on'); }
function el(tag, attrs, text){
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}

/* ---------------- 通用：纵坐标控件（刻度类型 + 上下限） ---------------- */
const AX = {};
function axState(id, init){
  if (!AX[id]) AX[id] = Object.assign({scale:'lin', min:null, max:null}, init || {});
  return AX[id];
}
function niceTicks(lo, hi, isLog){
  if (!(hi > lo)) return [lo];
  const out = [];
  if (isLog) {
    const a = Math.floor(Math.log10(lo)), b = Math.ceil(Math.log10(hi));
    const mults = (b - a) <= 3 ? [1, 2, 5] : [1];
    for (let e = a; e <= b; e++) for (const m of mults) {
      const v = m * Math.pow(10, e);
      if (v >= lo * 0.999 && v <= hi * 1.001) out.push(v);
    }
  } else {
    const span = hi - lo;
    if (span <= 0) return [lo];
    const raw = span / 6, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw) || 10 * mag;
    for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step)
      out.push(+v.toPrecision(12));
  }
  return out.length ? out : [lo, hi];
}
/* 把数值映射成 0~100 的百分比宽度，供 CSS 条形使用 */
function barPct(v, st, autoMin, autoMax){
  const isLog = st.scale === 'log';
  const lo = st.min != null ? st.min : (isLog ? Math.max(autoMin || 1e-9, 1e-9) : 0);
  const hi = st.max != null ? st.max : (autoMax || 1);
  if (isLog) {
    const a = Math.log10(Math.max(lo, 1e-9)), b = Math.log10(Math.max(hi, lo * 10));
    return Math.max(0, Math.min(1.6, (Math.log10(Math.max(v, lo)) - a) / (b - a))) * 100;
  }
  const b = Math.max(hi, lo + 1e-9);
  return Math.max(0, Math.min(1.6, (v - lo) / (b - lo))) * 100;
}
function axisControl(parent, state, onChange){
  const wrap = document.createElement('span');
  wrap.className = 'axwrap';
  const seg = document.createElement('span');
  seg.className = 'seg';
  const mk = (val, label) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.dataset.s = val;
    if (val === state.scale) b.classList.add('on');
    b.onclick = () => {
      seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      state.scale = val; onChange();
    };
    return b;
  };
  seg.appendChild(mk('log', '等比（对数）'));
  seg.appendChild(mk('lin', '等差（线性）'));
  wrap.appendChild(seg);
  const mkNum = (key, ph) => {
    const i = document.createElement('input');
    i.type = 'number'; i.step = 'any'; i.placeholder = ph; i.className = 'axnum';
    if (state[key] != null) i.value = state[key];
    i.onchange = () => {
      const t = i.value.trim();
      const v = t === '' ? null : Number(t);
      state[key] = (v === null || isNaN(v)) ? null : v;
      if (state[key] === null) i.value = '';
      onChange();
    };
    i.onkeydown = e => { if (e.key === 'Enter') i.blur(); };
    return i;
  };
  const minI = mkNum('min', '自动'), maxI = mkNum('max', '自动');
  const lb = t => { const x = document.createElement('span'); x.className = 'lbl'; x.textContent = t; return x; };
  const reset = document.createElement('button');
  reset.type = 'button'; reset.className = 'axreset'; reset.textContent = '自动';
  reset.onclick = () => {
    state.min = null; state.max = null; minI.value = ''; maxI.value = '';
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.s === state.scale));
    onChange();
  };
  wrap.append(lb('最小'), minI, lb('最大'), maxI, reset);
  parent.appendChild(wrap);
  return wrap;
}

let tlState = { on:new Set(Object.keys(V)), from:'2022-09', to:'2026-10' };
function viewTimeline(root){
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<h2>主流模型的输入价格与发布时间 <span class="tag">交互散点</span></h2>
    <div class="desc">每个点是一个模型。价格跨度达数千倍——<b>等比（对数）</b>能同时看清低端与高端，<b>等差（线性）</b>更能反映绝对差距。悬停查看详情。</div>

  root.appendChild(card);

  const dated = DATA.models.filter(m => m.d);
  const months = [...new Set(dated.map(m => m.d.slice(0,7)))].sort();
  const fs = card.querySelector('#from'), ts = card.querySelector('#to');
  fs.innerHTML = months.map(m => `<option>${m}</option>`).join('');
  ts.innerHTML = months.map(m => `<option>${m}</option>`).join('');
  fs.value = months[0]; ts.value = months[months.length-1];
  fs.onchange = () => { tlState.from = fs.value; draw(); };
  ts.onchange = () => { tlState.to = ts.value; draw(); };

  const chips = card.querySelector('#chips');
  Object.entries(V).forEach(([k, [cn, c]]) => {
    const b = document.createElement('span');
    b.className = 'chip on';
    b.innerHTML = `<i style="background:${c}"></i>${cn}`;
    b.onclick = () => { b.classList.toggle('on');
      if (b.classList.contains('on')) tlState.on.add(k); else tlState.on.delete(k);
      draw(); };
    chips.appendChild(b);
  });
  const cntEl = card.querySelector('#cnt');
  const sTL = axState('timeline', {scale:'log'});
  axisControl(card.querySelector('#scalebox'), sTL, draw);
  function draw(){
    const box = card.querySelector('#chart'); box.innerHTML = '';
    const list = dated.filter(m => tlState.on.has(m.v) && m.d.slice(0,7) >= tlState.from && m.d.slice(0,7) <= tlState.to);
    cntEl.textContent = `当前显示 ${list.length} 个模型`;
    const W = 1160, H = 520, L = 62, R = 24, T = 16, B = 46;
    const t0 = new Date(tlState.from + '-01').getTime(), t1 = new Date(tlState.to + '-28').getTime();
    const svg = el('svg', {viewBox:`0 0 ${W} ${H}`});
    const isLog = sTL.scale === 'log';
    const autoMax = Math.max(160, ...list.map(m => m.i)) * 1.06;
    const PMAX = sTL.max != null ? sTL.max : autoMax;
    const PMIN = Math.max(sTL.min != null ? sTL.min : 0.02, 1e-9);
    const lmin = Math.log10(PMIN), lmax = Math.log10(Math.max(PMAX, PMIN * 10));
    const X = d => L + (d - t0) / (t1 - t0 || 1) * (W - L - R);
    const Y = p => {
      const t = isLog ? (lmax - Math.log10(Math.max(p, PMIN))) / (lmax - lmin)
                      : (PMAX - p) / PMAX;
      return T + t * (H - T - B);
    };
    const customTL = sTL.min != null || sTL.max != null;
    const yticks = (customTL
        ? niceTicks(PMIN, PMAX, isLog)
        : (isLog ? [0.05,0.1,0.5,1,5,10,50,100] : [0,25,50,75,100,125,150]))
      .filter(v => v >= PMIN * 0.999 && v <= PMAX * 1.001);
    yticks.forEach(p => {
      svg.appendChild(el('line', {class:'grid', x1:L, x2:W-R, y1:Y(p), y2:Y(p)}));
      svg.appendChild(el('text', {class:'axis', x:L-8, y:Y(p)+4, 'text-anchor':'end'}, fmt(p)));
    });
    const d0 = new Date(tlState.from + '-01'), d1 = new Date(tlState.to + '-01');
    // 按可用宽度自动抽稀月份标签，避免文字重叠
    const totalM = (d1.getFullYear() - d0.getFullYear()) * 12 + (d1.getMonth() - d0.getMonth()) + 1;
    const maxLabels = Math.max(3, Math.floor((W - L - R) / 84));
    const stepM = Math.max(1, Math.ceil(totalM / maxLabels));
    let mi = 0;
    let cur = new Date(d0.getFullYear(), d0.getMonth(), 1);
    while (cur <= d1) {
      if (mi % stepM === 0 || mi === totalM - 1) {

/* ---------------- 通用：柱状 / 折线 ---------------- */
function barChart(box, rows, opt){
  box.innerHTML = '';
  const W = 1160, H = opt.h || 420, L = 68, R = 30, T = 24, B = 54;
  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`});
  const vals = rows.map(r => r[1]);
  const isLog = !!opt.log;
  const dmax = Math.max(...vals);
  const dminRaw = isLog ? Math.min(...vals.filter(v => v > 0)) : 0;
  const dmin = isLog ? Math.pow(10, Math.floor(Math.log10(dminRaw))) : 0;   // 对数基线取整十次幂，避免最矮的柱不可见
  const lo = isLog ? Math.max(opt.ymin != null ? opt.ymin : dmin, 1e-9)
                   : (opt.ymin != null ? opt.ymin : 0);
  const hi = opt.ymax != null ? opt.ymax : dmax * (isLog ? 1 : 1.06);
  const tOf = v => isLog
      ? (Math.log10(hi) - Math.log10(Math.max(v, lo))) / (Math.log10(hi) - Math.log10(lo) || 1)
      : (hi - v) / (hi - lo || 1);
  const Y = v => T + Math.max(-0.6, Math.min(1.6, tOf(v))) * (H - T - B);
  const bw = (W - L - R) / rows.length * 0.62;
  const custom = opt.ymin != null || opt.ymax != null;
  const grid = custom ? niceTicks(lo, hi, isLog) : (opt.grid || niceTicks(lo, hi, isLog));
  grid.filter(g => g >= lo * 0.999 && g <= hi * 1.001).forEach(g => {
    const y = Y(g);
    svg.appendChild(el('line', {class:'grid', x1:L, x2:W-R, y1:y, y2:y}));
    svg.appendChild(el('text', {class:'axis', x:L-8, y:y+4, 'text-anchor':'end'}, fmt(g)));
  });
  rows.forEach((r, i) => {
    const cx = L + (i + 0.5) * (W - L - R) / rows.length;
    const y = Y(r[1]), h = H - B - y;
    const g = el('g', {style:'cursor:pointer'});
    const c = r[2] || '#2E75B6';
    g.appendChild(el('rect', {x:cx-bw/2, y:y, width:bw, height:Math.max(h,1), rx:5, fill:c}));
    g.appendChild(el('text', {x:cx, y:y-9, 'text-anchor':'middle',
      style:'font-size:12.5px;font-weight:700;fill:#1b2330'}, opt.label ? opt.label(r[1]) : fmt(r[1])));
    g.appendChild(el('text', {class:'axis', x:cx, y:H-B+20, 'text-anchor':'middle'}, r[0]));
    const tipHtml = opt.tip ? opt.tip(r) : `<b>${r[0]}</b><br>${r[1]}`;
    g.addEventListener('mouseenter', e => showTip(e, tipHtml));
    g.addEventListener('mousemove', moveTip);
    g.addEventListener('mouseleave', hideTip);
    svg.appendChild(g);
  });
  if (opt.ylabel) svg.appendChild(el('text', {class:'axis', x:16, y:H/2,
    transform:`rotate(-90 16 ${H/2})`, 'text-anchor':'middle'}, opt.ylabel));
  box.appendChild(svg);
}

function lineChart(box, series, opt){
  box.innerHTML = '';
  const W = 1160, H = opt.h || 470, L = 66, R = 130, T = 20, B = 46;
  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`});
  const all = series.flatMap(s => s.data.map(d => d[1]));
  const isLog = !!opt.log;
  const dmax = Math.max(...all), dmin = Math.min(...all);
  const lo = isLog ? Math.max(opt.ymin != null ? opt.ymin : dmin, 1e-9)
                   : (opt.ymin != null ? opt.ymin : 0);
  const hi = opt.ymax != null ? opt.ymax : dmax * 1.04;
  const n = series[0].data.length;
  const X = i => L + i / (n - 1) * (W - L - R);
  const Y = v => {
    const t = isLog ? (Math.log10(hi) - Math.log10(Math.max(v, lo))) / (Math.log10(hi) - Math.log10(lo) || 1)
                    : (hi - v) / (hi - lo || 1);
    return T + Math.max(-0.6, Math.min(1.6, t)) * (H - T - B);
  };
  const custom = opt.ymin != null || opt.ymax != null;
  const grid = custom ? niceTicks(lo, hi, isLog) : (opt.grid || niceTicks(lo, hi, isLog));
  grid.filter(g => g >= lo * 0.999 && g <= hi * 1.001).forEach(g => {
    const y = Y(g);
    svg.appendChild(el('line', {class:'grid', x1:L, x2:W-R, y1:y, y2:y}));
    svg.appendChild(el('text', {class:'axis', x:L-8, y:y+4, 'text-anchor':'end'}, fmt(g)));
  });
  const step = Math.ceil(n / 12);
  series[0].data.forEach((d, i) => {
    if (i % step) return;
    svg.appendChild(el('text', {class:'axis', x:X(i), y:H-B+20, 'text-anchor':'middle'}, d[0]));
  });
  series.forEach(s => {
    const pts = s.data.map((d, i) => X(i) + ',' + Y(d[1])).join(' ');
    svg.appendChild(el('polyline', {points:pts, fill:'none', stroke:s.color,
      'stroke-width':s.w || 2.2, 'stroke-linejoin':'round'}));
    s.data.forEach((d, i) => {
      const g = el('g', {style:'cursor:pointer'});
      g.appendChild(el('circle', {cx:X(i), cy:Y(d[1]), r:8, fill:'transparent'}));
      g.addEventListener('mouseenter', e => showTip(e, `<b>${s.name}</b><br>${d[0]}：${opt.valTip ? opt.valTip(d[1]) : d[1]}`));
      g.addEventListener('mousemove', moveTip);
      g.addEventListener('mouseleave', hideTip);
      svg.appendChild(g);
    });
    const last = s.data[s.data.length-1];
    svg.appendChild(el('text', {class:'axis', x:W-R+8, y:Y(last[1])+4,
      style:`fill:${s.color};font-size:12px;font-weight:600`}, s.name));
  });
  box.appendChild(svg);
}

  card.innerHTML = `<h2>主流 AI 公司股价走势 <span class="tag">归一化对比</span></h2>
    <div class="desc">美国公司以 2016-10 = 100；中国公司以 2023-01 = 100。已复权。点击图例可隐藏/显示。</div>
    <div class="ctrl">
      <select id="mkt"><option value="us">美股（2016-10 起）</option><option value="cn">A 股（2023-01 起）</option></select>
      <span class="lbl" id="cnt"></span><span class="lbl" id="scalebox2"></span>
    </div><div id="chart"></div>
    <div class="legend" id="lg"></div>
    <div class="src"><b>来源：</b>纳斯达克官方历史行情接口（美股，日线复权后取月收盘）；东方财富行情接口（A 股，前复权月 K）</div>`;
  root.appendChild(card);
  const mkt = card.querySelector('#mkt');
  let hidden = new Set();
  const sSt = axState('stocks', {scale:'log'});
  const PAL = ['#1F3864','#C00000','#ED7D31','#548235','#7030A0','#0E9AA7','#BF9000','#2E75B6','#7F7F7F'];
  function draw(){
    const box = card.querySelector('#chart'); box.innerHTML = '';
    const lg = card.querySelector('#lg'); lg.innerHTML = '';
    const isUS = mkt.value === 'us';
    const src = isUS ? DATA.series.usStocks : DATA.series.cnStocks;
    const names = isUS ? DATA.series.usNames : null;
    const keys = Object.keys(src);
    const series = keys.map((k, idx) => {
      const data = src[k];
      const base = data[0][1];
      const nm = isUS ? (names[k] || k).split(' ')[0] : k;
      return {name:nm, color:PAL[idx % PAL.length], w: 2.6,
              data: data.map(d => [d[0], +(d[1] / base * 100).toFixed(1)])};
    }).filter(s => !hidden.has(s.name));
    card.querySelector('#cnt').textContent = `共 ${keys.length} 条序列`;
    lineChart(box, series, {log: sSt.scale === 'log', h:490, valTip:v=>v.toFixed(0),
      ymin:sSt.min, ymax:sSt.max,
      grid: sSt.scale === 'log' ? [20,50,100,200,500,1000,2000,5000,10000]
                                : [0,500,1000,1500,2000,2500,3000]});
    keys.forEach((k, idx) => {
      const nm = isUS ? (names[k] || k).split(' ')[0] : k;
      const s = document.createElement('span');
      if (hidden.has(nm)) s.className = 'off';
      s.innerHTML = `<i style="background:${PAL[idx % PAL.length]}"></i>${nm}`;
      s.onclick = () => { hidden.has(nm) ? hidden.delete(nm) : hidden.add(nm); draw(); };
      lg.appendChild(s);
    });
  }
  mkt.onchange = () => { hidden = new Set(); draw(); };
  axisControl(card.querySelector('#scalebox2'), sSt, draw);
  draw();
}

/* ---------------- 视图：公司发展速率 ---------------- */
const ORG_COLORS = ['#1F3864','#C00000','#2E75B6','#ED7D31','#548235','#7030A0',
                    '#0E9AA7','#BF9000','#7F7F7F','#79A857','#E8A33D'];
let orgHidden = new Set();
function viewOrgs(root){
  const list = (DATA.orgRates || []).slice()
      .sort((a,b) => (b.rate_post ?? -99) - (a.rate_post ?? -99));
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<h2>各公司模型发展速率 <span class="tag">ECI 口径</span></h2>
    <div class="desc">把每家公司历代<strong>最强</strong>模型的 ECI 连成前沿曲线再线性拟合，斜率即「每年提升多少 ECI 点」。
      深色条为推理模型期（2024-09 起），浅色条为全期。条长按最大值等比绘制。</div>
    <div id="bars" style="margin-bottom:6px"></div>
    <div class="src" id="note"></div>`;
  root.appendChild(card);

  const mx = Math.max(...list.map(o => Math.max(o.rate_post || 0, o.rate_all || 0)), 1);
  const box = card.querySelector('#bars');
  list.forEach(o => {
    const rp = o.rate_post, ra = o.rate_all;
    const d = document.createElement('div');
    d.style.cssText = 'display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:12px;padding:5px 0';
    const wp = rp != null ? Math.max(rp / mx * 100, 0.8) : 0;
    const wa = ra != null ? Math.max(ra / mx * 100, 0.8) : 0;
    d.innerHTML = `<div style="font-size:13px;font-weight:600">${o.org}
        <span style="color:#9aa5b4;font-weight:400">（${o.n}）</span></div>
      <div style="position:relative;height:26px">
        <div style="position:absolute;left:0;width:${wa}%;top:4px;height:8px;border-radius:4px;
          background:#C7D5E8"></div>
        <div style="position:absolute;left:0;width:${wp}%;top:14px;height:9px;border-radius:4px;
          background:linear-gradient(90deg,#1F3864,#2E75B6)"></div>
      </div>
      <div style="text-align:right;font-size:12.5px;color:#5b6676">
        <b style="color:#1F3864;font-size:14px">${rp != null ? rp.toFixed(1) : '—'}</b> 点/年
        <span style="color:#9aa5b4">（全期 ${ra != null ? ra.toFixed(1) : '—'}）</span></div>`;
    box.appendChild(d);
  });
  card.querySelector('#note').innerHTML =
    `<b>口径：</b>Epoch AI Capabilities Index，274 个模型，2023-02 至 2026-09；` +
    `前沿包络取历史最高分。括号内为该公司的模型数。<b>注意：</b>斜率对样本区间敏感，` +
    `模型数少或时间跨度短的公司（如智谱 GLM、Moonshot）外推误差较大。`;

  // 前沿曲线对比
  const c2 = document.createElement('div'); c2.className = 'card';
  c2.innerHTML = `<h2>各公司前沿 ECI 曲线 <span class="tag">点击图例可隐藏</span></h2>
    <div class="desc">每家公司的历史最高 ECI 随时间的推进。曲线越陡，迭代越快；曲线越高，当前能力越强。</div>
    <div class="ctrl" id="ctrl0"></div>
    <div id="chart"></div><div class="legend" id="lg"></div>`;
  root.appendChild(c2);
  const box2 = c2.querySelector('#chart'), lg = c2.querySelector('#lg');
  const sOr = axState('orgFrontier', {scale:'lin', min:90, max:175});

  function draw(){
    box2.innerHTML = ''; lg.innerHTML = '';
    const W = 1160, H = 520, L = 62, R = 128, T = 16, B = 44;
    const t0 = new Date('2023-01-01').getTime(), t1 = new Date('2026-11-01').getTime();
    const svg = el('svg', {viewBox:`0 0 ${W} ${H}`});
    const isLog = sOr.scale === 'log';
    const yLo = sOr.min != null ? sOr.min : 90;
    const yHi = sOr.max != null ? sOr.max : 175;
    const l0 = Math.log10(Math.max(yLo, 1)), l1 = Math.log10(Math.max(yHi, 1));
    const X = ms => L + (ms - t0) / (t1 - t0) * (W - L - R);
    const Y = v => {
      const t = isLog ? (l1 - Math.log10(Math.max(v, Math.max(yLo, 1)))) / (l1 - l0 || 1)
                      : (yHi - v) / (yHi - yLo || 1);
      return T + Math.max(-0.6, Math.min(1.6, t)) * (H - T - B);
    };
    niceTicks(yLo, yHi, isLog).forEach(v => {
      svg.appendChild(el('line', {class:'grid', x1:L, x2:W-R, y1:Y(v), y2:Y(v)}));
      svg.appendChild(el('text', {class:'axis', x:L-8, y:Y(v)+4, 'text-anchor':'end'},
        isLog ? fmt(v) : Math.round(v)));
    });
    const d0 = new Date('2023-01-01'), d1 = new Date('2026-11-01');
    const totalM = (d1.getFullYear()-d0.getFullYear())*12 + (d1.getMonth()-d0.getMonth()) + 1;
    const stepM = Math.max(1, Math.ceil(totalM / Math.max(3, Math.floor((W-L-R)/84))));
    let mi = 0, cur = new Date(2023, 0, 1);
    while (cur <= d1) {
      if (mi % stepM === 0) {
        const x = X(cur.getTime());
        svg.appendChild(el('line', {class:'grid', x1:x, x2:x, y1:T, y2:H-B}));
        svg.appendChild(el('text', {class:'axis', x:x, y:H-B+18, 'text-anchor':'middle'},
          cur.getFullYear() + '.' + String(cur.getMonth()+1).padStart(2,'0')));
      }
      mi++; cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    }
    list.forEach((o, idx) => {
      if (orgHidden.has(o.org)) return;
      const c = ORG_COLORS[idx % ORG_COLORS.length];
      const pts = o.frontier.map(p => X(new Date(p[0]).getTime()) + ',' + Y(p[1])).join(' ');
      svg.appendChild(el('polyline', {points:pts, fill:'none', stroke:c,
        'stroke-width':2.4, 'stroke-linejoin':'round'}));
      o.frontier.forEach(p => {
        const g = el('g', {style:'cursor:pointer'});
        g.appendChild(el('circle', {cx:X(new Date(p[0]).getTime()), cy:Y(p[1]),
          r:5, fill:c, 'fill-opacity':.8, stroke:'#fff', 'stroke-width':1}));
        g.addEventListener('mouseenter', e => showTip(e,
          `<b>${o.org}</b><br>${p[2]}<br>ECI ${p[1]}<br>${p[0]}`));
        g.addEventListener('mousemove', moveTip);
        g.addEventListener('mouseleave', hideTip);
        svg.appendChild(g);
      });
      const last = o.frontier[o.frontier.length-1];
      svg.appendChild(el('text', {class:'axis', x:W-R+8, y:Y(last[1])+4,
        style:`fill:${c};font-size:11.5px;font-weight:600`}, o.org));
    });
    box2.appendChild(svg);
    list.forEach((o, idx) => {
      const s = document.createElement('span');
      const c = ORG_COLORS[idx % ORG_COLORS.length];
      if (orgHidden.has(o.org)) s.className = 'off';
      s.innerHTML = `<i style="background:${c}"></i>${o.org}`;
      s.onclick = () => { orgHidden.has(o.org) ? orgHidden.delete(o.org) : orgHidden.add(o.org); draw(); };
      lg.appendChild(s);
    });
  }
  axisControl(c2.querySelector('#ctrl0'), sOr, draw);
  draw();
}

/* ---------------- 视图：价值与分配（图表） ---------------- */
function viewValue(root){
  const V = DATA.valueCharts;
  if (!V) { root.appendChild(document.createTextNode('数据未加载')); return; }

  // ---- 图 1：单位算力价值阶梯
  const c1 = document.createElement('div'); c1.className = 'card';
  c1.innerHTML = `<h2>单位算力的价值阶梯 <span class="tag">单位任务成本的核心证据</span></h2>
    <div class="desc">同一瓦 GPU 算力，越往上层卖，价差越大。从物理层卖到「场景结果」层，
      价差可达 <b>70–160 倍</b>——这直接说明<b>价值不在词元里，在词元解决了什么问题里</b>。
      纵轴默认用等比，因为跨度接近 180 倍。</div>
    <div class="ctrl" id="vc1"></div><div id="vg1"></div>

     ylabel:'每 GPU-W·月（美元）',
     grid: s1.scale === 'log' ? [1,10,100,1000] : [0,40,80,120,160],
     label: v => '$' + (v >= 100 ? v : v.toFixed(2)),

  axisControl(c2.querySelector('#vc2'), s2, d2); d2();

  // ---- 图 3：Agent 任务的词元消耗
  const c3 = document.createElement('div'); c3.className = 'card';
  c3.innerHTML = `<h2>Agent 任务的词元消耗倍数 <span class="tag">以普通聊天 = 1</span></h2>
    <div class="desc">这是「杰文斯悖论」在词元经济里的具体机制：单价越降，越敢上 Agent；

    <div class="ctrl" id="vc3"></div><div id="vg3"></div>

        <span style="color:#2E75B6;font-weight:700">训练 ${tr}%</span> ·
        <span style="color:#C00000;font-weight:700">推理 ${inf}%</span></div>`;
    box4.appendChild(d);
  });
  const lg = document.createElement('div');
  lg.style.cssText = 'margin-top:8px;font-size:12px;color:#8b96a5';
  lg.textContent = '蓝 = 训练（模型研发）　红 = 推理（对外卖 Token）';
  box4.appendChild(lg);
}

/* ---------------- 视图：数据信源 ---------------- */
function viewSources(root){
  const groups = DATA.sources || [];
  const total = groups.reduce((a, g) => a + g.items.length, 0);
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<h2>数据信源总览 <span class="tag">${total} 条原始来源</span></h2>
    <div class="desc">本看板所有数据均来自下列公开来源，点击可直接打开原网页核查。
      部分来源为二次转载（如 Synergy、TrendForce 经行业媒体转载），已在条目中标注。</div>
    <div class="ctrl"><input type="search" id="sq" placeholder="搜索来源名称或网址，如 iea / 信通院 / nvidia">
      <span class="lbl" id="scnt"></span></div>
    <div id="list"></div>
    <div class="src"><b>提示：</b>学术论文与机构报告建议按标题检索原文；价格与指数类数据可直接下载原始数据集复算。
      各分栏图表下方亦标注了对应的具体来源。</div>`;
  root.appendChild(card);

  const list = card.querySelector('#list'), q = card.querySelector('#sq'),
        cEl = card.querySelector('#scnt');
  function draw(){
    const kw = q.value.trim().toLowerCase();
    list.innerHTML = '';
    let shown = 0;
    groups.forEach(g => {
      const hits = g.items.filter(it =>
        !kw || it.name.toLowerCase().includes(kw) || it.url.toLowerCase().includes(kw));
      if (!hits.length) return;
      shown += hits.length;
      const d = document.createElement('div'); d.className = 'srcgrp';
      d.innerHTML = `<h3>${g.group}　<span style="color:#9aa5b4;font-weight:400;font-size:12px">
          ${hits.length} 条</span></h3>
        <div class="srclist">${hits.map(it =>
          `<a href="${it.url}" target="_blank" rel="noopener noreferrer">${it.name}<br>
             <span style="color:#9aa5b4;font-size:11.5px">${it.url}</span></a>`).join('')}</div>`;
      list.appendChild(d);
    });
    cEl.textContent = `显示 ${shown} / ${total} 条`;
  }
  q.oninput = draw;
  draw();
}

/* ---------------- 路由 ---------------- */
const TABS = [
  ['ladder', '词元价格天梯', viewLadder],
  ['timeline', '价格时间轴', viewTimeline],
  ['vendors', '厂商价格区间', viewVendors],
  ['orgs', '公司发展速率', viewOrgs],
  ['energy', '数据中心用电', viewEnergy],
  ['count', '数据中心数量', viewCount],
  ['compute', '算力与资本开支', viewCompute],
  ['tokens', '词元消耗量', viewTokens],
  ['stocks', '股价走势', viewStocks],
  ['value', '价值与分配', viewValue],
  ['sources', '数据信源', viewSources],
];
const nav = document.getElementById('nav'), view = document.getElementById('view');
TABS.forEach(([id, label], i) => {
  const b = document.createElement('button');
  b.textContent = label; b.dataset.id = id;
  b.onclick = () => { location.hash = id; };
  nav.appendChild(b);
});
function route(){
  const id = (location.hash || '#ladder').slice(1);
  const t = TABS.find(x => x[0] === id) || TABS[0];
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === t[0]));
  view.innerHTML = '';
  t[2](view);
  window.scrollTo({top:0, behavior:'smooth'});
}
window.addEventListener('hashchange', route);
route();
</script>
